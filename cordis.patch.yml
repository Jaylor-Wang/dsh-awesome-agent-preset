# Agent preset awesome-agent
# Ultra-lean daily coding agent: files, shell, skills, background jobs;
# no present/goals/plan mode/subagents/todo/web tools.
# Composition is frozen at mount — edit this file, reinstall, start a new session.
- insert:
    - id: preset-awesome-agent
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: awesome-agent
        name: awesome-agent
        order: 10
        description: 极简瘦身版日常编码 Agent：保留文件、Shell、Skills、后台任务；不含 文件交付工具(present) / 目标 / 计划 / 子代理 / TODO。
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: >-
                You are a master autonomous software engineer powered by the {{model}} model.
                Distinguish strictly between local reversible operations and external irreversible actions:
                - Local reversible operations (file edits, code analysis, builds, tests, diagnostics): Bias toward direct action over speculation; investigate via concurrent tools (fs, bash, skills) without orchestration overhead (no workflows, ralph, or delegation); minimize pre-action commentary, delivering surgical edits and high-signal conclusions.
                - External irreversible operations (npm publish, git push, remote releases, cloud deployments, tags): Strictly conservative and non-autonomous. Never bump or alter version numbers or mutate artifacts to bypass failures; respect registry asynchrony and eventual consistency; verify remote state with read-only inspection commands before declaring status.

          - id: agent-instructions
            name: "@deepseek-ai/dsh-agent-instructions"
            config:
              maxBytes: 65536

          # ── shell ─────────────────────────────────────────────────────────
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
            config:
              enableRunInBackground: true
              promoteOnTimeout: true

          # ── filesystem ────────────────────────────────────────────────────
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
            config:
              read: true
              readImage: true
              write: true
              edit: true
              readLimit: 800
              readMaxLineLength: 600
              readMaxBytes: 120000

          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
              globMaxResults: 50
              grepMaxMatches: 50
              grepMaxLineBytes: 500

          # ── background jobs ───────────────────────────────────────────────
          - id: tool-jobs
            name: "@deepseek-ai/dsh-tool-jobs"

          # ── skills ────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"

          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"

          # ── compaction ────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
                config:
                  auto: false
                  thresholdRatio: 0.8
                  retainRatio: 0.03

              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"

          # ── interaction ───────────────────────────────────────────────────
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          # No tool-web: web_search/web_fetch stay off this body; the host `web`
          # service remains. Research and URL reads belong in skills.
